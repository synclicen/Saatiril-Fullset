<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
#camera-video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
#capture-canvas { display: none; }
#status {
  position: absolute;
  top: 8px;
  left: 8px;
  color: #fff;
  font-size: 12px;
  font-family: monospace;
  background: rgba(0,0,0,0.6);
  padding: 4px 8px;
  border-radius: 4px;
  z-index: 10;
  pointer-events: none;
}
#error-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.85);
  color: #ff6b6b;
  font-family: sans-serif;
  text-align: center;
  z-index: 20;
}
#error-overlay h3 { font-size: 18px; margin-bottom: 8px; }
#error-overlay p { font-size: 14px; color: #ccc; max-width: 80%; }
</style>
</head>
<body>

<video id="camera-video" autoplay playsinline muted></video>
<canvas id="capture-canvas"></canvas>
<div id="status">Initializing...</div>
<div id="error-overlay">
  <h3>Camera Error</h3>
  <p id="error-message"></p>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// Saatiril WebView Camera Engine
// ═══════════════════════════════════════════════════════════════════
// This mirrors EXACTLY how the Electron/Chrome version handles USB
// cameras via getUserMedia. Chrome/Chromium has its own built-in UVC
// driver that bypasses Android's broken Camera2 HAL.
//
// Flow: enumerateDevices → select USB → getUserMedia → video element
//       Capture: canvas → toDataURL → base64 → Android bridge
// ═══════════════════════════════════════════════════════════════════

const video = document.getElementById('camera-video');
const canvas = document.getElementById('capture-canvas');
const statusEl = document.getElementById('status');
const errorOverlay = document.getElementById('error-overlay');
const errorMsg = document.getElementById('error-message');

let currentStream = null;
let currentDeviceId = null;
let cameraDevices = [];
let isReady = false;
let captureConfig = { aspectRatio: 4/3, filterPreset: 'original' };
let frameOverlay = null; // base64 frame image

// ─── Camera Enumeration ──────────────────────────────────────────

async function enumerateCameras() {
  try {
    // Must get a stream first to get device labels (Chrome security requirement)
    if (!currentStream) {
      const tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      tempStream.getTracks().forEach(t => t.stop());
    }

    const devices = await navigator.mediaDevices.enumerateDevices();
    cameraDevices = devices.filter(d => d.kind === 'videoinput');

    const deviceList = cameraDevices.map((d, i) => ({
      deviceId: d.deviceId,
      label: d.label || ('Camera ' + (i + 1)),
      isExternal: isExternalCamera(d)
    }));

    console.log('[Camera] Found ' + deviceList.length + ' cameras:', JSON.stringify(deviceList));

    // Notify Android of camera list
    if (window.AndroidBridge) {
      window.AndroidBridge.onCameraList(JSON.stringify(deviceList));
    }

    return deviceList;
  } catch (e) {
    console.error('[Camera] Enumerate failed:', e);
    showError('Failed to enumerate cameras: ' + e.message);
    return [];
  }
}

function isExternalCamera(device) {
  const label = (device.label || '').toLowerCase();
  // USB capture cards typically show as "USB Camera", "Capture Card", "UVC", etc.
  // On some devices they may show with specific brand names
  return label.includes('usb') ||
         label.includes('capture') ||
         label.includes('uvc') ||
         label.includes('external') ||
         label.includes('hdmi') ||
         label.includes('video capture') ||
         label.includes('av to usb') ||
         label.includes('jaso') ||  // JASOZ brand
         label.includes('ezcap') ||
         label.includes('magewell') ||
         label.includes('elgato') ||
         label.includes('camlink') ||
         label.includes('avermedia') ||
         // Generic: devices with higher index are often external
         (device.deviceId && device.deviceId.length > 20);
}

// ─── Camera Selection ────────────────────────────────────────────

async function selectCamera(deviceId) {
  console.log('[Camera] selectCamera called: deviceId=' + deviceId);

  // Stop existing stream
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
  }

  try {
    let constraints;

    if (deviceId) {
      // Specific device (USB capture card selected from dropdown)
      constraints = {
        video: {
          deviceId: { exact: deviceId },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      };
    } else {
      // Default: try to find USB camera first, then any camera
      const usbCamera = cameraDevices.find(d => isExternalCamera(d));
      if (usbCamera) {
        constraints = {
          video: {
            deviceId: { exact: usbCamera.deviceId },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
      } else {
        constraints = {
          video: {
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            facingMode: 'environment'
          },
          audio: false
        };
      }
    }

    console.log('[Camera] Getting user media with constraints:', JSON.stringify(constraints));
    const stream = await navigator.mediaDevices.getUserMedia(constraints);

    currentStream = stream;
    currentDeviceId = stream.getVideoTracks()[0]?.getSettings()?.deviceId || deviceId;
    video.srcObject = stream;

    // Wait for video to actually play
    await new Promise((resolve, reject) => {
      video.onloadedmetadata = () => {
        video.play()
          .then(resolve)
          .catch(reject);
      };
      video.onerror = reject;
      setTimeout(() => reject(new Error('Video play timeout')), 10000);
    });

    isReady = true;
    const track = stream.getVideoTracks()[0];
    const settings = track?.getSettings() || {};
    const info = {
      deviceId: currentDeviceId,
      label: track?.label || 'Unknown',
      width: settings.width || video.videoWidth,
      height: settings.height || video.videoHeight,
      isExternal: isExternalCamera({ deviceId: currentDeviceId, label: track?.label })
    };

    statusEl.textContent = (info.isExternal ? 'USB: ' : 'Camera: ') + info.label + ' (' + info.width + 'x' + info.height + ')';
    console.log('[Camera] Camera ready:', JSON.stringify(info));

    // Notify Android
    if (window.AndroidBridge) {
      window.AndroidBridge.onCameraReady(JSON.stringify(info));
    }

    // Re-enumerate to get labels
    await enumerateCameras();

    return info;
  } catch (e) {
    console.error('[Camera] selectCamera failed:', e);
    showError('Camera failed: ' + e.message);

    if (window.AndroidBridge) {
      window.AndroidBridge.onCameraError('Camera failed: ' + e.message);
    }
    return null;
  }
}

// ─── Auto-start: Find and start best camera ─────────────────────

async function autoStart() {
  console.log('[Camera] autoStart called');
  statusEl.textContent = 'Scanning cameras...';

  // Enumerate first
  const devices = await enumerateCameras();

  if (devices.length === 0) {
    showError('No cameras found');
    if (window.AndroidBridge) {
      window.AndroidBridge.onCameraError('No cameras found');
    }
    return;
  }

  // Try USB camera first (matching Electron behavior)
  const usbCamera = devices.find(d => d.isExternal);
  if (usbCamera) {
    console.log('[Camera] USB camera found, selecting: ' + usbCamera.label);
    statusEl.textContent = 'Connecting to USB camera...';
    await selectCamera(usbCamera.deviceId);
  } else {
    console.log('[Camera] No USB camera, using default');
    statusEl.textContent = 'Starting camera...';
    await selectCamera(null);
  }
}

// ─── Photo Capture ───────────────────────────────────────────────

function capturePhoto() {
  if (!isReady || !currentStream) {
    console.error('[Camera] Cannot capture: camera not ready');
    if (window.AndroidBridge) {
      window.AndroidBridge.onCaptureResult(null);
    }
    return;
  }

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) {
    console.error('[Camera] Cannot capture: video dimensions unknown');
    if (window.AndroidBridge) {
      window.AndroidBridge.onCaptureResult(null);
    }
    return;
  }

  const aspectRatio = captureConfig.aspectRatio || (4/3);
  const targetWidth = 1920;
  const targetHeight = Math.round(targetWidth / aspectRatio);

  canvas.width = targetWidth;
  canvas.height = targetHeight;
  const ctx = canvas.getContext('2d');

  // Fill black
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, targetWidth, targetHeight);

  // Center-crop to aspect ratio
  const videoRatio = vw / vh;
  let sx, sy, sw, sh;
  if (videoRatio > aspectRatio) {
    // Video is wider — crop sides
    sw = vh * aspectRatio;
    sh = vh;
    sx = (vw - sw) / 2;
    sy = 0;
  } else {
    // Video is taller — crop top/bottom
    sw = vw;
    sh = vw / aspectRatio;
    sx = 0;
    sy = (vh - sh) / 2;
  }

  // Apply filter (same as Electron version)
  applyFilter(ctx, captureConfig.filterPreset);

  // Draw video frame
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, targetWidth, targetHeight);

  // Reset filter for overlay
  ctx.filter = 'none';

  // Draw frame overlay if loaded
  if (frameOverlay) {
    try {
      ctx.drawImage(frameOverlay, 0, 0, targetWidth, targetHeight);
    } catch (e) {
      console.warn('[Camera] Frame overlay draw failed:', e);
    }
  }

  // Convert to JPEG base64
  const dataUrl = canvas.toDataURL('image/jpeg', 0.95);

  console.log('[Camera] Photo captured: ' + targetWidth + 'x' + targetHeight + ' (' + dataUrl.length + ' chars)');

  // Send to Android
  if (window.AndroidBridge) {
    window.AndroidBridge.onCaptureResult(dataUrl);
  }

  return dataUrl;
}

// ─── CSS Filter Presets (matching Electron version) ──────────────

function applyFilter(ctx, preset) {
  switch (preset) {
    case 'studio':
      ctx.filter = 'brightness(1.1) contrast(1.05) saturate(1.1)';
      break;
    case 'cinematic':
      ctx.filter = 'brightness(0.95) contrast(1.1) saturate(1.3) sepia(0.15)';
      break;
    case 'pro':
      ctx.filter = 'brightness(1.05) contrast(1.25) saturate(1.15)';
      break;
    case 'vivid':
      ctx.filter = 'brightness(1.08) contrast(1.12) saturate(1.45)';
      break;
    case 'softPortrait':
      ctx.filter = 'brightness(1.12) contrast(0.92) saturate(1.08)';
      break;
    case 'classicFilm':
      ctx.filter = 'brightness(1.02) contrast(1.15) saturate(0.85)';
      break;
    case 'dramaticBW':
      ctx.filter = 'brightness(1.05) contrast(1.35) saturate(0)';
      break;
    case 'warmSunset':
      ctx.filter = 'brightness(1.06) contrast(1.08) saturate(1.3) sepia(0.1)';
      break;
    case 'original':
    default:
      ctx.filter = 'none';
      break;
  }
}

// ─── Frame Overlay ───────────────────────────────────────────────

function setFrameOverlay(base64Data) {
  if (!base64Data) {
    frameOverlay = null;
    return;
  }
  const img = new Image();
  img.onload = () => {
    frameOverlay = img;
    console.log('[Camera] Frame overlay loaded: ' + img.width + 'x' + img.height);
  };
  img.onerror = (e) => {
    console.error('[Camera] Frame overlay load failed:', e);
    frameOverlay = null;
  };
  img.src = base64Data;
}

// ─── Update Config ───────────────────────────────────────────────

function updateConfig(config) {
  if (config.aspectRatio) captureConfig.aspectRatio = config.aspectRatio;
  if (config.filterPreset) captureConfig.filterPreset = config.filterPreset;
  console.log('[Camera] Config updated:', JSON.stringify(captureConfig));
}

// ─── Error Display ───────────────────────────────────────────────

function showError(message) {
  errorMsg.textContent = message;
  errorOverlay.style.display = 'flex';
  statusEl.textContent = 'Error: ' + message.substring(0, 50);
}

function hideError() {
  errorOverlay.style.display = 'none';
}

// ─── Device Change Listener ──────────────────────────────────────

navigator.mediaDevices.addEventListener('devicechange', async () => {
  console.log('[Camera] Device change detected');
  const devices = await enumerateCameras();

  // Check if current camera was disconnected
  if (currentDeviceId) {
    const stillExists = devices.find(d => d.deviceId === currentDeviceId);
    if (!stillExists) {
      console.log('[Camera] Current camera disconnected, auto-restarting');
      currentDeviceId = null;
      isReady = false;
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }
      await autoStart();
    }
  }

  // Notify Android of device change
  if (window.AndroidBridge) {
    window.AndroidBridge.onDeviceChange();
  }
});

// ─── Initialization ──────────────────────────────────────────────

console.log('[Camera] Saatiril WebView Camera Engine loaded');
statusEl.textContent = 'Camera engine ready, waiting for permission...';

// Auto-start after a short delay to let Android set up the bridge
setTimeout(() => {
  autoStart();
}, 500);

</script>
</body>
</html>
