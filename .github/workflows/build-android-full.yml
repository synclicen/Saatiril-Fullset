name: Build Saatiril Full System APK

on:
  push:
    branches: [main]
    paths:
      - 'android-full-app/**'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/build-android-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # ── Build Next.js Static Export ──
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Bun
      run: |
        curl -fsSL https://bun.sh/install | bash
        echo "$HOME/.bun/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: bun install

    - name: Build Next.js static export
      run: |
        # Temporarily move API routes out (they're incompatible with static export)
        mkdir -p /tmp/api-routes-bak
        mv src/app/api/apk-download /tmp/api-routes-bak/ 2>/dev/null || true
        mv src/app/api/generate-license /tmp/api-routes-bak/ 2>/dev/null || true

        # Enable static export in next.config.ts
        sed -i 's|// output: "export",|output: "export",|' next.config.ts

        # Build
        bun run build

        # Restore API routes
        mv /tmp/api-routes-bak/apk-download src/app/api/ 2>/dev/null || true
        mv /tmp/api-routes-bak/generate-license src/app/api/ 2>/dev/null || true

        # Revert next.config.ts
        sed -i 's|output: "export",|// output: "export",|' next.config.ts

        # Verify the output
        echo "=== Static export size ==="
        du -sh out/
        echo "=== Files in out/ ==="
        ls -la out/

    - name: Copy static export to Android assets
      run: |
        rm -rf android-full-app/app/src/main/assets/web
        mkdir -p android-full-app/app/src/main/assets/web
        cp -r out/* android-full-app/app/src/main/assets/web/
        echo "=== Web assets copied ==="
        du -sh android-full-app/app/src/main/assets/web/

    # ── Build Android APK ──
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 12266719
        accept-android-sdk-licenses: true
        packages: 'tools platform-tools'

    - name: Accept Android SDK Licenses Manually
      run: |
        mkdir -p -m 0775 "$ANDROID_HOME/licenses"
        echo "y" | yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        if [ -d "$ANDROID_HOME/cmdline-tools/16.0" ]; then
          echo "y" | yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --licenses || true
        fi

    - name: Install SDK components
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "SDK components installed"

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          android-full-app/.gradle
        key: gradle-full-v3-${{ hashFiles('android-full-app/**/*.gradle.kts', 'android-full-app/**/gradle-wrapper.properties') }}
        restore-keys: gradle-full-v3-

    - name: Create local.properties
      working-directory: android-full-app
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "local.properties created with sdk.dir=$ANDROID_HOME"

    - name: Grant execute permission for gradlew
      working-directory: android-full-app
      run: chmod +x gradlew

    - name: Verify project structure
      working-directory: android-full-app
      run: |
        echo "=== Project structure ==="
        find . -name "*.kt" -o -name "*.kts" -o -name "*.xml" -o -name "*.properties" | sort
        echo "=== Web assets ==="
        ls -la app/src/main/assets/web/ | head -20
        echo "=== Web assets size ==="
        du -sh app/src/main/assets/web/

    # ── Debug Build ──
    - name: Build Debug APK
      working-directory: android-full-app
      run: |
        set -o pipefail
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-full
        path: android-full-app/build-log.txt

    - name: Find and Rename Debug APK
      run: |
        echo "=== All APK files in build directory ==="
        find android-full-app/app/build/outputs -name '*.apk' -ls 2>/dev/null || echo "No APK files found anywhere"
        DEBUG_APK=$(find android-full-app/app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -1)
        if [ -z "$DEBUG_APK" ]; then
          echo "ERROR: No debug APK found!"
          exit 1
        fi
        echo "Found debug APK: $DEBUG_APK"
        cp "$DEBUG_APK" android-full-app/app/build/outputs/apk/debug/saatiril-full-system-debug.apk
        echo "Debug APK size: $(du -h android-full-app/app/build/outputs/apk/debug/saatiril-full-system-debug.apk | cut -f1)"

    - name: Upload Debug APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: saatiril-full-system-android-debug
        path: android-full-app/app/build/outputs/apk/debug/saatiril-full-system-debug.apk

    # ── Release Build ──
    - name: Build Release APK
      working-directory: android-full-app
      run: |
        set -o pipefail
        ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log-release.txt

    - name: Find and Rename Release APK
      run: |
        echo "=== Looking for release APK ==="
        find android-full-app/app/build/outputs/apk/release -name '*.apk' -ls || true
        RELEASE_APK=$(find android-full-app/app/build/outputs/apk/release -name '*.apk' | head -1)
        if [ -z "$RELEASE_APK" ]; then
          echo "ERROR: No release APK found!"
          exit 1
        fi
        echo "Found release APK: $RELEASE_APK"
        cp "$RELEASE_APK" android-full-app/app/build/outputs/apk/release/saatiril-full-system.apk
        echo "Release APK size: $(du -h android-full-app/app/build/outputs/apk/release/saatiril-full-system.apk | cut -f1)"

    - name: Upload Release APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: saatiril-full-system-android
        path: android-full-app/app/build/outputs/apk/release/saatiril-full-system.apk

    # ── Auto-publish APK to GitHub Releases ──
    - name: Upload Full System APK to latest release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        APK_PATH="android-full-app/app/build/outputs/apk/release/saatiril-full-system.apk"

        if gh release view latest 2>/dev/null; then
          echo "Existing 'latest' release found — replacing Full System APK asset"
          gh release delete-asset latest saatiril-full-system.apk --yes 2>/dev/null || true
          gh release upload latest "$APK_PATH" --clobber
          echo "Full System APK uploaded to existing 'latest' release"
        else
          echo "No 'latest' release found — creating new one"
          gh release create latest \
            "$APK_PATH" \
            --title "Saatiril Full System - Latest" \
            --notes "Saatiril Full System APK (Standalone + Server mode) from build #${{ github.run_number }} (${{ github.sha }})" \
            --prerelease
          echo "Created 'latest' release with Full System APK"
        fi
