name: Build Saatiril FULL APK Android

on:
  push:
    branches: [main]
    paths:
      - 'android-full/**'
      - '.github/workflows/build-android-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 12266719
        accept-android-sdk-licenses: true
        packages: 'tools platform-tools'

    - name: Accept Android SDK Licenses Manually
      run: |
        mkdir -p -m 0775 "$ANDROID_HOME/licenses"
        echo "y" | yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        if [ -d "$ANDROID_HOME/cmdline-tools/16.0" ]; then
          echo "y" | yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --licenses || true
        fi

    - name: Install SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          android-full/.gradle
        key: gradle-full-${{ hashFiles('android-full/**/*.gradle.kts', 'android-full/**/gradle-wrapper.properties') }}
        restore-keys: gradle-full-

    - name: Create local.properties
      working-directory: android-full
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Grant execute permission for gradlew
      working-directory: android-full
      run: chmod +x gradlew

    # ── Build Debug APK first (faster, catches compile errors) ──
    - name: Build Debug APK
      working-directory: android-full
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Build Release APK
      working-directory: android-full
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Rename APKs
      run: |
        DEBUG_APK="android-full/app/build/outputs/apk/debug/app-debug.apk"
        RELEASE_APK="android-full/app/build/outputs/apk/release/app-release.apk"

        cp "$DEBUG_APK" "android-full/app/build/outputs/apk/debug/saatiril-full-debug.apk"
        echo "Debug APK size: $(du -h android-full/app/build/outputs/apk/debug/saatiril-full-debug.apk | cut -f1)"

        cp "$RELEASE_APK" "android-full/app/build/outputs/apk/release/saatiril-full.apk"
        echo "Release APK size: $(du -h android-full/app/build/outputs/apk/release/saatiril-full.apk | cut -f1)"

    - name: Upload Debug APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: saatiril-full-android-debug
        path: android-full/app/build/outputs/apk/debug/saatiril-full-debug.apk

    - name: Upload Release APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: saatiril-full-android-release
        path: android-full/app/build/outputs/apk/release/saatiril-full.apk

    # ── Auto-publish Release APK to GitHub Releases ──
    - name: Upload FULL APK to latest release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        APK="android-full/app/build/outputs/apk/release/saatiril-full.apk"
        if gh release view latest 2>/dev/null; then
          echo "Existing 'latest' release found — replacing FULL APK asset only"
          gh release delete-asset latest saatiril-full.apk --yes 2>/dev/null || true
          gh release upload latest "$APK" --clobber
          echo "FULL APK uploaded to existing 'latest' release"
        else
          echo "No 'latest' release found — creating new one with FULL APK"
          gh release create latest \
            "$APK" \
            --title "Saatiril Full - Latest" \
            --notes "FULL APK terbaru (Admin+MC+Operator) dari build #${{ github.run_number }} (${{ github.sha }})" \
            --prerelease
          echo "Created 'latest' release with FULL APK"
        fi
