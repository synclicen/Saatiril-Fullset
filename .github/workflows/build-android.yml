name: Build Saatiril APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 12266719
        accept-android-sdk-licenses: true
        packages: 'tools platform-tools'

    # Force accept all Android SDK licenses — prevents interactive prompt hang
    - name: Accept Android SDK Licenses Manually
      run: |
        mkdir -p -m 0775 "$ANDROID_HOME/licenses"
        echo "y" | yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        if [ -d "$ANDROID_HOME/cmdline-tools/16.0" ]; then
          echo "y" | yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --licenses || true
        fi

    - name: Install SDK components
      run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          android-operator/.gradle
        key: gradle-${{ hashFiles('android-operator/**/*.gradle.kts', 'android-operator/**/gradle-wrapper.properties') }}
        restore-keys: gradle-

    - name: Create local.properties
      working-directory: android-operator
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Grant execute permission for gradlew
      working-directory: android-operator
      run: chmod +x gradlew

    - name: Build Debug APK
      working-directory: android-operator
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Rename APK to saatiril-operator.apk
      working-directory: android-operator/app/build/outputs/apk/debug
      run: |
        cp app-debug.apk saatiril-operator.apk
        echo "APK size: $(du -h saatiril-operator.apk | cut -f1)"

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: saatiril-operator-android
        path: android-operator/app/build/outputs/apk/debug/saatiril-operator.apk

    # ── Auto-publish APK to GitHub Releases (tag: latest) ──
    # Don't delete the entire release — just replace the APK asset so portable exe stays intact
    - name: Upload APK to latest release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Check if 'latest' release already exists
        if gh release view latest 2>/dev/null; then
          echo "Existing 'latest' release found — replacing APK asset only"
          # Delete old APK asset if exists
          gh release delete-asset latest saatiril-operator.apk --yes 2>/dev/null || true
          # Upload new APK
          gh release upload latest android-operator/app/build/outputs/apk/debug/saatiril-operator.apk --clobber
          echo "APK uploaded to existing 'latest' release"
        else
          echo "No 'latest' release found — creating new one with APK"
          # Create the release (Electron build will add portable later)
          gh release create latest \
            android-operator/app/build/outputs/apk/debug/saatiril-operator.apk \
            --title "Saatiril Operator - Latest" \
            --notes "APK terbaru dari build #${{ github.run_number }} (${{ github.sha }})" \
            --prerelease
          echo "Created 'latest' release with APK"
        fi
