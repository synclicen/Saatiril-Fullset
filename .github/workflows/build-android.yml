name: Build Saatiril

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─── Windows Build (Next.js + Electron) ────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install bun
        run: npm install -g bun
          
      - name: Install dependencies
        run: bun install
        
      - name: Build Next.js (export)
        run: bun run build:export
        continue-on-error: true
        
      - name: Build Next.js (standard)
        if: failure()
        run: bun run build
        
      - name: Upload Next.js build
        uses: actions/upload-artifact@v4
        with:
          name: saatiril-nextjs-build
          path: .next/
          continue-on-error: true

  # ─── Android Build (Operator App) ──────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android-operator/.gradle
          key: gradle-${{ hashFiles('android-operator/**/*.gradle.kts', 'android-operator/**/gradle-wrapper.properties') }}
          restore-keys: gradle-
          
      - name: Create local.properties
        working-directory: android-operator
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        working-directory: android-operator
        run: chmod +x gradlew
          
      - name: Build Debug APK
        working-directory: android-operator
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saatiril-operator-android
          path: android-operator/app/build/outputs/apk/debug/*.apk

  # ─── Release ───────────────────────────────────────────────
  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            saatiril-operator-android/*.apk
          body: |
            ## Saatiril Release ${{ github.ref_name }}
            
            ### 📦 Downloads
            - **Android Operator App**: `app-debug.apk`
            
            ### 📱 Android App Setup
            1. Download the APK to your phone
            2. Enable "Install from Unknown Sources" in Settings
            3. Install the APK
            4. Open the app and enter the Saatiril server IP
            5. For external camera: connect HDMI capture card via USB-C OTG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
